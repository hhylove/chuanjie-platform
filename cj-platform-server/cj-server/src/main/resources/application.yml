# 公共应用配置（所有 profile 共享）
spring:
  application:
    # 应用名：日志、监控、注册识别用
    name: cj-platform-server
  profiles:
    # 默认 profile：nodocker=内存 H2、不连本机 Postgres/Redis
    # 有 docker compose 时改为 local，或启动参数 --spring.profiles.active=local
    active: nodocker
  jackson:
    # 序列化时忽略 null 字段，减小响应体
    default-property-inclusion: non_null

server:
  # HTTP 服务端口；前端 Vite 代理默认指向此端口
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # 仅暴露健康与信息端点，避免误开敏感 actuator
        include: health,info
  endpoint:
    health:
      # 健康检查返回组件明细，便于 S0 探活排障
      show-details: always

mybatis-plus:
  configuration:
    # 库字段下划线自动映射 Java 驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 逻辑删除字段名（与表 deleted 一致）
      logic-delete-field: deleted
      # 已删除取值
      logic-delete-value: true
      # 未删除取值
      logic-not-delete-value: false

cj:
  security:
    jwt:
      # HS256 签名密钥（本地默认值；生产必须用环境变量覆盖，勿提交真实生产密钥）
      secret: "cj-platform-dev-jwt-secret-change-me-32bytes-min"
      # Access Token 过期秒数（短时效）
      access-expire-seconds: 7200
      # Refresh Token 过期秒数
      refresh-expire-seconds: 604800
    sso:
      # 是否启用外部 SSO（Casdoor 等）；S1 固定 false，仅文档预留
      enabled: false
      # SSO 提供方标识；enabled=true 时才有意义
      provider: casdoor

# springdoc-openapi：自动生成 OpenAPI 3 + Swagger UI
springdoc:
  api-docs:
    # 是否暴露 /v3/api-docs；本地联调打开，生产可按环境关闭
    enabled: true
    # OpenAPI JSON 路径
    path: /v3/api-docs
  swagger-ui:
    # 是否启用 Swagger UI 页面
    enabled: true
    # UI 入口（访问 /swagger-ui.html 会跳到实际资源）
    path: /swagger-ui.html
    # 按 tag 字母排序，便于查找模块
    tags-sorter: alpha
    # 按 method 排序
    operations-sorter: method
  # 只扫描业务包，避免噪声
  packages-to-scan: com.chuanjie.platform
  # 仅文档化这些路径前缀
  paths-to-match: /admin-api/**,/actuator/**
